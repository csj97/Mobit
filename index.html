<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOBIT 이용자 게시판</title>
    <link rel="stylesheet" href="style.css?v=1.4.2" />

    <!-- Firebase CDN (모듈 아님, window.firebase에 attach됨) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  </head>

  <body>
    <main class="wrap">
      <header class="board-header">
        <p class="eyebrow">MOBIT 게시판</p>
        <h1 class="board-title">모의비트 이용자 게시판</h1>
        <p class="board-desc">
          사용하시면서 불편했던 점이나 추가됐으면 하는 기능을 남겨주세요.
          최대한 반영하겠습니다.
        </p>
        <a class="contact" href="mailto:whtjdwo78@naver.com">
          <span class="contact-label">문의</span>
          whtjdwo78@naver.com
        </a>
      </header>

      <section class="composer">
        <textarea
          id="postContent"
          rows="4"
          placeholder="의견을 자유롭게 남겨주세요"
        ></textarea>
        <div class="composer-actions">
          <button type="button" class="btn-primary" onclick="submitPost()">
            등록하기
          </button>
        </div>
      </section>

      <section class="posts">
        <div class="posts-head">
          <h2 class="posts-title">최근 의견</h2>
          <span id="postsCount" class="posts-count"></span>
        </div>
        <div id="postsContainer"></div>
        <p id="postsEmpty" class="posts-empty" hidden>
          아직 등록된 의견이 없어요. 첫 의견을 남겨보세요.
        </p>
      </section>
    </main>

    <script src="app.js?v=1.4.0"></script>
  </body>
</html>
