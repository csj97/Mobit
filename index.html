<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOBIT 이용자 게시판</title>
    <link rel="stylesheet" href="style.css" />
    
    <!-- Firebase CDN (모듈 아님, window.firebase에 attach됨) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  </head>
  
  <body>
    <h1>📣 MOBIT 이용자 게시판</h1>
    <h5>모의비트 앱을 이용해주셔서 진심으로 감사합니다.</h5>
    <h5>사용하시면서 불편하셨던 점이나 추가됐으면 하는 기능이 있다면 개발자에게 알려주세요.</h5>
    <h5>최대한 여러분의 의견을 반영하도록 노력하는 MOBIT이 되겠습니다.</h5>
    <h5>진심으로 감사드립니다.</h5>
    
    <textarea id="postContent" rows="4" placeholder="모의비트를 위한 다양한 의견을 남겨주세요..."></textarea>
    <button onclick="submitPost()">등록하기</button>
    
    <div id="postsScrollArea">
      <div id="postsContainer">
      </div>
    </div>
    
    <script src="app.js"></script>
  </body>
</html>
