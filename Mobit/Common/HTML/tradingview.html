<!DOCTYPE html>
<html lang="ko">
  <head>
	<meta charset="UTF-8">
	  <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>TradingView Chart</title>
		<style>
		  /* WKWebView는 앱의 overrideUserInterfaceStyle을 상속하므로 prefers-color-scheme으로 앱 테마를 따른다 */
		  :root { color-scheme: light dark; }
		  html, body, .tradingview-widget-container, #tradingview_Chart {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			background-color: #ffffff;
		  }
		  @media (prefers-color-scheme: dark) {
			html, body, .tradingview-widget-container, #tradingview_Chart {
			  background-color: #131722;
			}
		  }
		</style>
  </head>
  <body>
	<div class="tradingview-widget-container">
	  <div id="tradingview_Chart"></div>
	</div>
	
	<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
	<script type="text/javascript">
	  const defaultSettings = {
		symbol: "UPBIT:BTCKRW",
		interval: "60",
		theme: "light",
		upColor: "#125ECE",
		downColor: "#E71A06"
	  };

	  function getQueryParam(param) {
		const urlParams = new URLSearchParams(window.location.search);
		return urlParams.get(param);
	  }
	  
	  const symbol = getQueryParam('symbol') || defaultSettings.symbol;
	  
	  function clearWidgetContainer() {
		const container = document.getElementById("tradingview_Chart");
		if (container) {
		  container.innerHTML = "";
		}
	  }

	  function createWidget(settings) {
		clearWidgetContainer();
		const toolbarBackground = settings.theme === "dark" ? "#131722" : "#f1f3f6";

		new TradingView.widget({
		  "container_id": "tradingview_Chart",
		  "width": "100%",
		  "height": "100%",
		  "symbol": settings.symbol,
		  "interval": settings.interval,
		  "timezone": "Asia/Seoul",
		  "theme": settings.theme,
		  "style": "1",
		  "locale": "kr",
		  "toolbar_bg": toolbarBackground,
		  "enable_publishing": false,
		  "hide_side_toolbar": false,
		  "allow_symbol_change": true,
		  "autosize": true,
		  "disabled_features": ["header_symbol_search"],
		  "overrides": {
			"mainSeriesProperties.candleStyle.upColor": settings.upColor,
			"mainSeriesProperties.candleStyle.downColor": settings.downColor,
			"mainSeriesProperties.candleStyle.borderUpColor": settings.upColor,
			"mainSeriesProperties.candleStyle.borderDownColor": settings.downColor,
			"mainSeriesProperties.candleStyle.wickUpColor": settings.upColor,
			"mainSeriesProperties.candleStyle.wickDownColor": settings.downColor
		  }
		});
	  }
	  
	  // 최초 렌더도 앱 테마를 따르게 해서 라이트로 그렸다가 바뀌는 깜빡임을 막는다
	  const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
	  createWidget({ ...defaultSettings, theme: systemTheme, symbol });
	  
	  function updateChart(newSymbol, interval, theme, upColor, downColor) {
		createWidget({
		  symbol: newSymbol || defaultSettings.symbol,
		  interval: interval || defaultSettings.interval,
		  theme: theme || defaultSettings.theme,
		  upColor: upColor || defaultSettings.upColor,
		  downColor: downColor || defaultSettings.downColor
		});
	  }
	</script>
  </body>
</html>
